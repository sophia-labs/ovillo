name: Capture MUS-T clippy diagnostics

on:
  push:
    branches:
      - agent/trajectory-persistent-bodies
    paths:
      - .github/workflows/trajectory-clippy-diagnostics.yml

permissions:
  contents: write

concurrency:
  group: trajectory-clippy-diagnostics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the integration branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install system library
        run: sudo apt-get update && sudo apt-get install -y libsoxr-dev

      - name: Install Rust and clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Capture the identical workspace command
        shell: bash
        run: |
          set +e
          cd mus-rs
          cargo clippy --workspace --all-targets -- -D warnings > /tmp/trajectory-clippy.log 2>&1
          status=$?
          cd ..
          {
            echo "exit_status=${status}"
            tail -n 1600 /tmp/trajectory-clippy.log
          } > .trajectory-clippy.log
          exit 0

      - name: Commit diagnostics and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/trajectory-clippy-diagnostics.yml
          git config user.name 'Sophia trajectory integrator'
          git config user.email 'noreply@sophia-labs.invalid'
          git add -A
          git commit -m 'Capture MUS-T clippy diagnostics'
          git push origin "HEAD:${GITHUB_REF_NAME}"
