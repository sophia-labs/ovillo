name: Materialize protected non-Abelian research

on:
  push:
    branches:
      - agent/ariadne-protected-nonabelian

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v5

      - name: Decode and verify research packet
        run: |
          cat .bootstrap/part-* | base64 -d > /tmp/ariadne-protected-bootstrap.tar.gz
          echo "33b6ba6ee27a16f011d8cd69fb60fddc907cb99299db92c33f4e8abac390e639  /tmp/ariadne-protected-bootstrap.tar.gz" | sha256sum -c -
          tar -xzf /tmp/ariadne-protected-bootstrap.tar.gz
          rm -rf .bootstrap
          # GITHUB_TOKEN may not create or modify workflow files. Land the
          # research tree first; the final workflow is added by the initiating
          # user after this materialization commit succeeds.
          rm -f .github/workflows/ariadne-protected-nonabelian.yml

      - name: Commit materialized research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "research: build protected non-Abelian acoustic instrument"
          git push origin HEAD:agent/ariadne-protected-nonabelian
