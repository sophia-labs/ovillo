name: One-shot regenerate unified Rust vectors

on:
  push:
    branches:
      - agent/gesture-body-unification
    paths:
      - ".github/workflows/one-shot-regenerate-unified-vectors.yml"

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install exporter runtime
        run: python -m pip install "numpy>=2"

      - name: Regenerate the committed Rust vectors
        run: python mus-rs/tools/unified_export_test_vectors.py

      - name: Rebuild the content manifest from the declared file set
        run: |
          python - <<'PY'
          from hashlib import sha256
          import json
          from pathlib import Path

          root = Path("paper/ariadne-protected-nonabelian/unified_artifacts")
          manifest_path = root / "unified_manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          rebuilt = []
          for item in manifest["files"]:
              path = root / item["path"]
              payload = path.read_bytes()
              rebuilt.append({
                  "bytes": len(payload),
                  "path": item["path"],
                  "sha256": sha256(payload).hexdigest(),
              })
          manifest["files"] = sorted(rebuilt, key=lambda item: item["path"])
          manifest_path.write_text(
              json.dumps(manifest, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          vector = next(item for item in rebuilt if item["path"] == "unified_rust_test_vectors.json")
          print(vector)
          PY

      - name: Commit regenerated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            paper/ariadne-protected-nonabelian/unified_artifacts/unified_rust_test_vectors.json \
            paper/ariadne-protected-nonabelian/unified_artifacts/unified_manifest.json
          if git diff --cached --quiet; then
            echo "Unified vectors already current"
            exit 0
          fi
          git commit -m "chore: regenerate unified Rust vectors"
          git push origin "HEAD:${GITHUB_REF_NAME}"
