name: One-shot branch normalization

on:
  push:
    branches:
      - agent/gesture-body-unification
    paths:
      - ".github/workflows/one-shot-rustfmt.yml"

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the branch, not the synthetic PR merge
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format the complete Rust workspace
        run: cargo fmt --all
        working-directory: mus-rs
      - name: Repair the unified artifact manifest
        run: |
          python - <<'PY'
          from hashlib import sha256
          import json
          from pathlib import Path

          root = Path("paper/ariadne-protected-nonabelian/unified_artifacts")
          manifest_path = root / "unified_manifest.json"
          vector_path = root / "unified_rust_test_vectors.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          payload = vector_path.read_bytes()
          entry = {
              "bytes": len(payload),
              "path": vector_path.name,
              "sha256": sha256(payload).hexdigest(),
          }
          files = [item for item in manifest["files"] if item["path"] != vector_path.name]
          files.append(entry)
          manifest["files"] = sorted(files, key=lambda item: item["path"])
          manifest_path.write_text(
              json.dumps(manifest, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          print(entry)
          PY
      - name: Commit the normalized result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mus-rs paper/ariadne-protected-nonabelian/unified_artifacts/unified_manifest.json
          if git diff --cached --quiet; then
            echo "Branch already normalized"
            exit 0
          fi
          git commit -m "chore: normalize Rust and unified manifest"
          git push origin "HEAD:${GITHUB_REF_NAME}"
