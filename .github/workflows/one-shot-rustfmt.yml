name: One-shot rustfmt for gesture-body branch

on:
  push:
    branches:
      - agent/gesture-body-unification
    paths:
      - ".github/workflows/one-shot-rustfmt.yml"

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the branch, not the synthetic PR merge
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format the complete Rust workspace
        run: cargo fmt --all
        working-directory: mus-rs
      - name: Commit the formatter result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mus-rs
          if git diff --cached --quiet; then
            echo "Workspace already formatted"
            exit 0
          fi
          git commit -m "chore: rustfmt unified workspace"
          git push origin "HEAD:${GITHUB_REF_NAME}"
