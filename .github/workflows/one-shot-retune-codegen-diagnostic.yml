name: One-shot retune pin provenance diagnostic

on:
  push:
    branches:
      - agent/gesture-body-unification
    paths:
      - ".github/workflows/one-shot-retune-codegen-diagnostic.yml"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: System audio libraries
        run: sudo apt-get update && sudo apt-get install -y libsoxr-dev

      - name: Use one exact Rust toolchain for both revisions
        uses: dtolnay/rust-toolchain@stable

      - name: Prepare the photographed revision and current research trunk
        run: |
          git worktree add /tmp/capture 334fcae2c566602d6dfc8634ffc8bcc4e8cf4516
          git worktree add /tmp/trunk f4648b56dd785139f9c1b99c6d8dd36f5c5da051
          python - <<'PY'
          from pathlib import Path

          probe = r'''
          use std::collections::BTreeMap;
          use std::fs;
          use std::path::Path;
          use mus_dsp::pluck::{pluck_note, weave_note};

          fn params(pairs: &[(&str, &str)]) -> BTreeMap<String, String> {
              pairs.iter().map(|(k, v)| (k.to_string(), v.to_string())).collect()
          }
          fn weave_extreme() -> BTreeMap<String, String> { params(&[
              ("synth","weave"),("sus","5"),("damp","0.9"),("courses","24"),
              ("couple","0.45"),("chirality","1"),("orbit","20"),
              ("orbit_depth","1"),("curvature","1"),("body","1")]) }
          fn guitar_extreme() -> BTreeMap<String, String> { params(&[
              ("synth","pluck"),("sus","0.05"),("damp","0"),("pos","0.02"),
              ("pick","1"),("stiff","1"),("tension","80"),("buzz","1"),
              ("body","1"),("symp","1"),("detune","60")]) }
          fn tension_decay() -> BTreeMap<String, String> { params(&[
              ("synth","pluck"),("sus","2.0"),("tension","80"),
              ("stiff","0.6"),("body","0.4"),("symp","0.5")]) }
          fn weave_chord() -> BTreeMap<String, String> {
              params(&[("synth","weave"),("sus","2.0")])
          }
          fn write(name: &str, audio: Vec<f32>) {
              let mut bytes = Vec::with_capacity(audio.len() * 4);
              for sample in audio { bytes.extend_from_slice(&sample.to_bits().to_le_bytes()); }
              fs::write(Path::new(&std::env::var("PROBE_OUT").unwrap()).join(name), bytes).unwrap();
          }
          fn main() {
              write("bent_weave_extreme.bin", weave_note(&weave_extreme(), &[82.4069,110.0,146.832], 0.45, 1.5));
              write("bent_guitar_extreme.bin", pluck_note(&guitar_extreme(), &[82.4069,110.0,146.832], 0.45, 1.5));
              write("tension_decay.bin", pluck_note(&tension_decay(), &[196.0], 1.0, 1.0));
              write("weave_chord.bin", weave_note(&weave_chord(), &[110.0,164.814,220.0], 1.0, 1.0));
          }
          '''
          for root in (Path('/tmp/capture/mus-rs'), Path('/tmp/trunk/mus-rs')):
              cargo = root / 'crates/mus-dsp/Cargo.toml'
              text = cargo.read_text()
              if 'libsoxr =' not in text:
                  text = text.replace('libc = "0.2"\n', 'libc = "0.2"\nlibsoxr = "0.2.9"\n')
              if 'realfft =' not in text:
                  text = text.replace('np-rand = { path = "../np-rand" }\n', 'np-rand = { path = "../np-rand" }\nrealfft = "3.5"\n')
              cargo.write_text(text)
              example = root / 'crates/mus-dsp/examples/byte_pin_probe.rs'
              example.parent.mkdir(parents=True, exist_ok=True)
              example.write_text(probe)
          PY
          mkdir -p /tmp/capture-out /tmp/trunk-out

      - name: Render the exact pre-retune photograph revision
        run: cargo run --release -p mus-dsp --example byte_pin_probe
        working-directory: /tmp/capture/mus-rs
        env:
          PROBE_OUT: /tmp/capture-out

      - name: Render the current research trunk
        run: cargo run --release -p mus-dsp --example byte_pin_probe
        working-directory: /tmp/trunk/mus-rs
        env:
          PROBE_OUT: /tmp/trunk-out

      - name: Classify source drift versus toolchain drift
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          expected = {
              'bent_weave_extreme.bin': 'ad3c074aa360ded1ca6adf039a6c565eb16f499c66f907a26020fbb8dc9dce21',
              'bent_guitar_extreme.bin': '81e5c9cc36152623be44b5d4d094f675b91af3ad057b6b1afce715ad87bbf359',
              'tension_decay.bin': '9b017a792f69aef7174e92327090a242e3b897d70fc4f89c765811e622a13a70',
              'weave_chord.bin': '8167b210afb4c336af9a45c2b8192ef367c8c2e836f0da232521ba29f2078dfb',
          }
          def digest(path: Path) -> str:
              payload = path.read_bytes()
              samples = len(payload) // 4
              h = sha256()
              h.update(samples.to_bytes(8, 'little'))
              h.update(payload)
              return h.hexdigest()

          capture_matches = True
          trunk_matches_capture = True
          for name, pin in expected.items():
              capture = digest(Path('/tmp/capture-out') / name)
              trunk = digest(Path('/tmp/trunk-out') / name)
              capture_matches &= capture == pin
              trunk_matches_capture &= trunk == capture
              print(f'{name}: pin={pin} capture={capture} trunk={trunk}')
          if capture_matches and not trunk_matches_capture:
              print('CLASSIFICATION=SOURCE_DRIFT_AFTER_334FCAE')
          elif not capture_matches and trunk_matches_capture:
              print('CLASSIFICATION=TOOLCHAIN_OR_PLATFORM_DRIFT')
          elif capture_matches and trunk_matches_capture:
              print('CLASSIFICATION=PIN_AND_TRUNK_MATCH')
          else:
              print('CLASSIFICATION=MIXED_OR_MULTIPLE_CAUSES')
          PY
