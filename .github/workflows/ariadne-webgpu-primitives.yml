name: ariadne-webgpu-primitives

on:
  push:
    paths:
      - "mus-rs/crates/mus-ariadne-webgpu/**"
      - "mus-rs/Cargo.toml"
      - ".github/workflows/ariadne-webgpu-primitives.yml"
  pull_request:
    paths:
      - "mus-rs/crates/mus-ariadne-webgpu/**"
      - "mus-rs/Cargo.toml"
      - ".github/workflows/ariadne-webgpu-primitives.yml"

jobs:
  native-and-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mus-rs
      - name: formatting
        run: cargo fmt --all -- --check
        working-directory: mus-rs
      - name: reference and contract tests
        run: cargo test --release -p mus-ariadne-webgpu --no-default-features
        working-directory: mus-rs
      - name: compile profiling integration
        run: cargo check -p mus-ariadne-webgpu --features profiling
        working-directory: mus-rs
      - name: focused clippy
        run: >-
          cargo clippy -p mus-ariadne-webgpu --all-targets --all-features --
          -D warnings
        working-directory: mus-rs
      - name: portable wasm build
        run: >-
          cargo check -p mus-ariadne-webgpu --target wasm32-unknown-unknown
          --no-default-features
        working-directory: mus-rs
