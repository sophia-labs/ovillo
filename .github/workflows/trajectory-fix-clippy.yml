name: Fix MUS-T clippy diagnostic

on:
  push:
    branches:
      - agent/trajectory-persistent-bodies
    paths:
      - .github/workflows/trajectory-fix-clippy.yml

permissions:
  contents: write

concurrency:
  group: trajectory-fix-clippy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the integration branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply the clippy rewrite
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("mus-rs/crates/mus-trajectory/src/lib.rs")
          lines = path.read_text(encoding="utf-8").splitlines()
          starts = [i for i, line in enumerate(lines) if line.strip() == "match rate_factor {"]
          if len(starts) != 1:
              raise SystemExit(f"expected one rate_factor match, found {len(starts)}")
          start = starts[0]
          if lines[start + 1].strip() != "Some(factor) => max_rate = max_rate.max(factor * delta.abs() / seconds),":
              raise SystemExit("unexpected Some arm")
          if lines[start + 2].strip() != "None => {}":
              raise SystemExit("unexpected None arm")
          if lines[start + 3].strip() != "}":
              raise SystemExit("unexpected match terminator")
          indent = lines[start][:-len(lines[start].lstrip())]
          replacement = [
              f"{indent}if let Some(factor) = rate_factor {{",
              f"{indent}    max_rate = max_rate.max(factor * delta.abs() / seconds);",
              f"{indent}}}",
          ]
          lines[start:start + 4] = replacement
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          rm -f .trajectory-clippy.log
          rm .github/workflows/trajectory-fix-clippy.yml

      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format and commit the correction
        shell: bash
        run: |
          set -euo pipefail
          cd mus-rs
          cargo fmt --all
          cd ..
          git config user.name 'Sophia trajectory integrator'
          git config user.email 'noreply@sophia-labs.invalid'
          git add -A
          git diff --cached --check
          git commit -m 'Fix MUS-T clippy single-match'
          git push origin "HEAD:${GITHUB_REF_NAME}"
