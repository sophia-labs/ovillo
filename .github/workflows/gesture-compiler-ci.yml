name: Ariadne gesture compiler reference

on:
  push:
    branches:
      - agent/ariadne-gesture-compiler
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install scientific runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2" "scipy>=1.14"

      - name: Compile and run theorem-shaped reference checks
        working-directory: paper/ariadne-gesture-compiler/reference
        run: |
          python -m py_compile ariadne_gesture/*.py run_experiments.py
          python run_experiments.py --quick --no-write >/tmp/ariadne-gesture-results.json
          python -m json.tool /tmp/ariadne-gesture-results.json >/dev/null

      # The committed artifact, not just a fresh temp run: results.json
      # sat unparseable on the mainline from 982cc8a until the Phase 1
      # regeneration because this workflow only ever validated /tmp.
      - name: Validate the COMMITTED artifacts parse
        run: |
          python -m json.tool paper/ariadne-gesture-compiler/reference/results.json >/dev/null
          python -m json.tool paper/ariadne-protected-nonabelian/results.json >/dev/null
          python -m json.tool paper/ariadne-protected-nonabelian/fixture.json >/dev/null
          python -m json.tool mus-rs/crates/mus-gesture/fixtures/tree_qr_oracle.json >/dev/null
