name: Integrate MUS-T into the ordinary renderer

on:
  push:
    branches:
      - agent/trajectory-persistent-bodies
    paths:
      - .trajectory-engine-patch.py
      - .github/workflows/trajectory-engine-integration-retry.yml

permissions:
  contents: write

concurrency:
  group: trajectory-engine-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the integration branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install system audio library
        run: sudo apt-get update && sudo apt-get install -y libsoxr-dev

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Install Rust gates
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Cache Rust build products
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mus-rs

      - name: Apply the guarded ordinary-renderer patch
        run: |
          set -euo pipefail
          python .trajectory-engine-patch.py
          rm .trajectory-engine-patch.py
          rm -f .github/workflows/trajectory-engine-integration.yml
          rm .github/workflows/trajectory-engine-integration-retry.yml
          rm -f .trajectory-engine-gate.log

      - name: Format the complete Rust workspace
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
        working-directory: mus-rs

      - name: Compile every target with warnings denied
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: mus-rs

      - name: Run the complete release workspace
        run: cargo test --release --workspace
        working-directory: mus-rs

      - name: Publish only the fully gated integration
        run: |
          set -euo pipefail
          git config user.name 'Sophia trajectory integrator'
          git config user.email 'noreply@sophia-labs.invalid'
          git add -A
          git diff --cached --check
          git commit -m 'Route MUS-T through ordinary render receipts'
          git push origin "HEAD:${GITHUB_REF_NAME}"
