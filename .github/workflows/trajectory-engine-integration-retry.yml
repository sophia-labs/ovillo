name: Retry and gate MUS-T ordinary renderer integration

on:
  push:
    branches:
      - agent/trajectory-persistent-bodies
    paths:
      - .github/workflows/trajectory-engine-integration-retry.yml

permissions:
  contents: write

concurrency:
  group: trajectory-engine-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the integration branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install system library
        run: sudo apt-get update && sudo apt-get install -y libsoxr-dev

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Install Rust gates
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Apply Stage D and run the full Rust gates
        shell: bash
        run: |
          set -euo pipefail
          python .trajectory-engine-patch.py
          rm .trajectory-engine-patch.py
          rm -f .github/workflows/trajectory-engine-integration.yml
          rm .github/workflows/trajectory-engine-integration-retry.yml
          rm -f .trajectory-engine-gate.log

          cd mus-rs
          cargo fmt --all

          set +e
          cargo clippy --workspace --all-targets -- -D warnings > /tmp/trajectory-engine-clippy.log 2>&1
          clippy_status=$?
          test_status=0
          if [[ ${clippy_status} -eq 0 ]]; then
            cargo test --release --workspace > /tmp/trajectory-engine-test.log 2>&1
            test_status=$?
          fi
          set -e
          cd ..

          if [[ ${clippy_status} -ne 0 ]]; then
            {
              echo 'gate=clippy'
              echo "exit_status=${clippy_status}"
              tail -n 3000 /tmp/trajectory-engine-clippy.log
            } > .trajectory-engine-gate.log
          elif [[ ${test_status} -ne 0 ]]; then
            {
              echo 'gate=test'
              echo "exit_status=${test_status}"
              tail -n 3000 /tmp/trajectory-engine-test.log
            } > .trajectory-engine-gate.log
          fi

          git config user.name 'Sophia trajectory integrator'
          git config user.email 'noreply@sophia-labs.invalid'
          git add -A
          git diff --cached --check
          if [[ ${clippy_status} -eq 0 && ${test_status} -eq 0 ]]; then
            git commit -m 'Route MUS-T through ordinary render receipts'
          else
            git commit -m 'Route MUS-T through ordinary renderer; capture next gate'
          fi
          git push origin "HEAD:${GITHUB_REF_NAME}"
