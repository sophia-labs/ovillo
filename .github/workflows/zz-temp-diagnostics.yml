# TEMPORARY, diagnostic only (removed by the next commit): runs the
# mus-workspace-ci steps after the mus-ariadne feature matrix on Linux,
# each continuing on error, to see which later steps pass or fail.
name: zz-temp-diagnostics
on:
  push:
    branches: [ci/green-20261021]
    paths: [".github/workflows/zz-temp-diagnostics.yml"]
permissions:
  contents: read
jobs:
  later-steps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y libsoxr-dev
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mus-rs
      - name: Shared World execution smoke
        continue-on-error: true
        run: cargo run -p mus-ariadne --release --example shared_world_bench -- 4 0.1
        working-directory: mus-rs
      - name: fmt
        continue-on-error: true
        run: cargo fmt --all -- --check
        working-directory: mus-rs
      - name: clippy
        continue-on-error: true
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: mus-rs
      - name: test (no fail fast)
        continue-on-error: true
        run: |
          cargo test --release --workspace --no-fail-fast 2>&1 | tee /tmp/test.log
          grep -E '^test .* FAILED|test result: FAILED|got: |expected: |left: |right: ' /tmp/test.log || true
        working-directory: mus-rs
