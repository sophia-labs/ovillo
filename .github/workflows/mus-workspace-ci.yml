# Workspace-wide law, architecture, formatting, lint, and test gate.
name: mus-workspace-ci
on:
  push:
    paths:
      - "mus-rs/**"
      - ".github/workflows/mus-workspace-ci.yml"
  pull_request:
    paths:
      - "mus-rs/**"

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: system libraries
        run: sudo apt-get update && sudo apt-get install -y libsoxr-dev
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Ariadne Shared World architecture
        run: python mus-rs/tools/check_ariadne_architecture.py
      - name: Ariadne pure-physics constitution
        run: python mus-rs/tools/check_ariadne_pure_physics.py
      - name: Ariadne Terminal independent law oracle
        run: python mus-rs/tools/verify_ariadne_terminal_laws.py --trials 10000 --json
      - name: Ariadne synchronized-active and resonance law oracle
        run: >-
          python
          mus-rs/experiments/ariadne_fidelity_performance_v1/reference/active_resonant_laws.py
          --trials 10000 --json
      - name: Ariadne shared string-brass law oracle
        run: >-
          python
          mus-rs/experiments/ariadne_string_brass_v1/reference/unified_boundary_laws.py
          --trials 10000 --json
      - name: Ariadne maximal metric-body law oracle
        run: >-
          python
          mus-rs/experiments/ariadne_string_brass_v2/reference/maximal_body_laws.py
          --trials 50000
      - name: install uv for parity and oracle-backed tests
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mus-rs
      - name: canonical Ariadne feature matrix
        run: cargo test -p mus-ariadne --all-features --release
        working-directory: mus-rs
      - name: Shared World execution smoke
        run: cargo run -p mus-ariadne --release --example shared_world_bench -- 4 0.1
        working-directory: mus-rs
      - name: fmt
        run: cargo fmt --all -- --check
        working-directory: mus-rs
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: mus-rs
      - name: test
        run: cargo test --release --workspace
        working-directory: mus-rs
