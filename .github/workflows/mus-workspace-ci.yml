# The gap the Phase 0/1 landing synthesist named: every Ariadne workflow
# is scoped to mus-watsn or the Python reference, so nothing gated the
# production engine, mus-gesture, or the parity/byte-law suites. This
# job is the net: the full workspace battery on every push that touches
# the Rust tree.
name: mus-workspace-ci
on:
  push:
    paths:
      - "mus-rs/**"
      - ".github/workflows/mus-workspace-ci.yml"
  pull_request:
    paths:
      - "mus-rs/**"
jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # mus-dsp links the soxr resampler; without the system library the
      # whole battery dies at build.
      - name: system libraries
        run: sudo apt-get update && sudo apt-get install -y libsoxr-dev
      # The mus-cli corpus parity test intentionally invokes the Python
      # checker through uv. Install that oracle runtime explicitly instead
      # of assuming it happens to be present on the hosted runner.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: install uv for parity and oracle-backed tests
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mus-rs
      - name: fmt
        run: cargo fmt --all -- --check
        working-directory: mus-rs
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: mus-rs
      - name: test
        run: cargo test --release --workspace
        working-directory: mus-rs
