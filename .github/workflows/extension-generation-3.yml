name: Extension Generation 3

on:
  pull_request:
    paths:
      - "extension/experiments/generation-3/**"
      - "mus-rs/crates/mus-ariadne/src/law/medium.rs"
      - "mus-rs/crates/mus-ariadne/src/law/mod.rs"
      - "mus-rs/crates/mus-ariadne/src/lib.rs"
      - "mus-rs/crates/mus-ariadne/tests/local_medium_fixture.rs"
      - "mus-rs/crates/mus-ariadne/examples/local_medium_proof.rs"
      - ".github/workflows/extension-generation-3.yml"
  push:
    paths:
      - "extension/experiments/generation-3/**"
      - "mus-rs/crates/mus-ariadne/src/law/medium.rs"
      - "mus-rs/crates/mus-ariadne/src/law/mod.rs"
      - "mus-rs/crates/mus-ariadne/src/lib.rs"
      - "mus-rs/crates/mus-ariadne/tests/local_medium_fixture.rs"
      - "mus-rs/crates/mus-ariadne/examples/local_medium_proof.rs"
      - ".github/workflows/extension-generation-3.yml"
  workflow_dispatch:

jobs:
  python-construction:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension/experiments/generation-3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      # The default PyPI torch wheel bundles ~4 GB of CUDA libraries and ran
      # the hosted runner out of disk. Everything here runs on the CPU
      # (`--device cpu` is the default), so install the CPU build of the same
      # pinned range first; pip then keeps it for `.[dev]`.
      - name: Install
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.7,<2.11'
          python -m pip install -e '.[dev]'
      - name: Boundary guard
        run: python scripts/check_boundaries.py
      - name: Validate JSON and replay fixture
        run: |
          python -m json.tool schemas/local-medium-v1.schema.json >/dev/null
          python -m json.tool fixtures/cross-runtime.json >/dev/null
          extension-generation3 replay fixtures/cross-runtime.json >/tmp/generation3-replay.json
          python scripts/verify_artifacts.py
      - name: Compile and test
        run: |
          python -m compileall -q src tests scripts
          pytest -q
      - name: Construction smoke
        run: |
          extension-generation3 train \
            --seed 20260814 --steps 55 --batch-size 96 \
            --output /tmp/extension-generation3-smoke

  rust-law:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mus-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mus-rs
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy -p mus-ariadne --all-targets -- -D warnings
      - name: Ariadne local-medium tests
        run: |
          cargo test --release -p mus-ariadne law::medium::tests
          cargo test --release -p mus-ariadne --test local_medium_fixture
          cargo run --release -p mus-ariadne --example local_medium_proof
