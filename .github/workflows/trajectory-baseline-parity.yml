name: Compare smoke parity against trajectory base

on:
  push:
    branches:
      - agent/trajectory-persistent-bodies
    paths:
      - .github/workflows/trajectory-baseline-parity.yml

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - run: sudo apt-get update && sudo apt-get install -y libsoxr-dev
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - uses: dtolnay/rust-toolchain@stable
      - name: Run identical smoke parity test at base and head
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/trajectory-base 352bb2d25bb093bb84a11a9740051b0fa8e73a1b

          set +e
          (
            cd /tmp/trajectory-base/mus-rs
            cargo test --release -p mus-cli --test parity_expectations \
              smoke_matches_committed_expectation -- --exact --nocapture
          ) > /tmp/base-smoke.log 2>&1
          base_status=$?

          (
            cd mus-rs
            cargo test --release -p mus-cli --test parity_expectations \
              smoke_matches_committed_expectation -- --exact --nocapture
          ) > /tmp/head-smoke.log 2>&1
          head_status=$?
          set -e

          {
            echo "base_status=${base_status}"
            echo "head_status=${head_status}"
            echo '--- BASE ---'
            tail -n 500 /tmp/base-smoke.log
            echo '--- HEAD ---'
            tail -n 500 /tmp/head-smoke.log
          } > .trajectory-baseline-parity.log

      - name: Commit comparison and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm -f .trajectory-test.log
          rm .github/workflows/trajectory-baseline-parity.yml
          git config user.name 'Sophia trajectory integrator'
          git config user.email 'noreply@sophia-labs.invalid'
          git add -A
          git diff --cached --check
          git commit -m 'Compare smoke parity at trajectory base and head'
          git push origin "HEAD:${GITHUB_REF_NAME}"
