name: Capture release workspace test diagnostics

on:
  push:
    branches:
      - agent/trajectory-persistent-bodies
    paths:
      - .github/workflows/trajectory-test-diagnostics.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - run: sudo apt-get update && sudo apt-get install -y libsoxr-dev
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - uses: dtolnay/rust-toolchain@stable
      - name: Capture the exact release workspace test
        shell: bash
        run: |
          set +e
          cd mus-rs
          cargo test --release --workspace > /tmp/trajectory-test.log 2>&1
          status=$?
          cd ..
          {
            echo "exit_status=${status}"
            tail -n 3000 /tmp/trajectory-test.log
          } > .trajectory-test.log
          exit 0
      - name: Commit diagnostics and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/trajectory-test-diagnostics.yml
          git config user.name 'Sophia trajectory integrator'
          git config user.email 'noreply@sophia-labs.invalid'
          git add -A
          git commit -m 'Capture release workspace test diagnostics'
          git push origin "HEAD:${GITHUB_REF_NAME}"
