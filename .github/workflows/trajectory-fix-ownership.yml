name: Fix MUS-T adapter ownership and run Rust gates

on:
  push:
    branches:
      - agent/trajectory-persistent-bodies
    paths:
      - .github/workflows/trajectory-fix-ownership.yml

permissions:
  contents: write

concurrency:
  group: trajectory-fix-ownership-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fix-and-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the integration branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install system library
        run: sudo apt-get update && sudo apt-get install -y libsoxr-dev

      - name: Install Rust gates
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Repair ownership, run gates, and preserve only a remaining diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('mus-rs/crates/mus-dsp/src/trajectory.rs')
          lines = path.read_text(encoding='utf-8').splitlines()
          signatures = [
              index
              for index, line in enumerate(lines)
              if line.strip() == 'fn from(error: TrajectoryError) -> Self {'
          ]
          if len(signatures) != 1:
              raise SystemExit(f'expected one TrajectoryError conversion, found {len(signatures)}')
          signature = signatures[0]
          indent = lines[signature][:-len(lines[signature].lstrip())]
          lines.insert(signature + 1, f'{indent}    let core_code = error.code().to_string();')
          old = '            core_code: Some(error.code().to_string()),'
          matches = [index for index, line in enumerate(lines) if line == old]
          if len(matches) != 1:
              raise SystemExit(f'expected one old core_code expression, found {len(matches)}')
          lines[matches[0]] = '            core_code: Some(core_code),'
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

          rm -f .trajectory-clippy.log .trajectory-test.log
          cd mus-rs
          cargo fmt --all

          set +e
          cargo clippy --workspace --all-targets -- -D warnings > /tmp/trajectory-clippy.log 2>&1
          clippy_status=$?
          test_status=0
          if [[ ${clippy_status} -eq 0 ]]; then
            cargo test --workspace --release > /tmp/trajectory-test.log 2>&1
            test_status=$?
          fi
          set -e
          cd ..

          if [[ ${clippy_status} -ne 0 ]]; then
            {
              echo 'gate=clippy'
              echo "exit_status=${clippy_status}"
              tail -n 2400 /tmp/trajectory-clippy.log
            } > .trajectory-clippy.log
          elif [[ ${test_status} -ne 0 ]]; then
            {
              echo 'gate=test'
              echo "exit_status=${test_status}"
              tail -n 2400 /tmp/trajectory-test.log
            } > .trajectory-test.log
          fi

          rm .github/workflows/trajectory-fix-ownership.yml
          git config user.name 'Sophia trajectory integrator'
          git config user.email 'noreply@sophia-labs.invalid'
          git add -A
          git diff --cached --check
          if [[ ${clippy_status} -eq 0 && ${test_status} -eq 0 ]]; then
            git commit -m 'Fix MUS-T adapter ownership; pass Rust gates'
          else
            git commit -m 'Fix MUS-T adapter ownership; capture next Rust gate'
          fi
          git push origin "HEAD:${GITHUB_REF_NAME}"
