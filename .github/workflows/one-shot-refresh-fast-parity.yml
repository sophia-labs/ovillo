name: One-shot refresh fast parity expectations

on:
  push:
    branches:
      - agent/gesture-body-unification
    paths:
      - ".github/workflows/one-shot-refresh-fast-parity.yml"

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: System audio libraries
        run: sudo apt-get update && sudo apt-get install -y libsoxr-dev

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Regenerate only after the parity tool accepts both fast scores
        run: >-
          uv run --python 3.12 --script mus-rs/tools/parity_render.py
          --build
          --write-expectations
          --out /tmp/fast-parity-report.json

      - name: Show the guarded parity evidence
        run: cat /tmp/fast-parity-report.json

      - name: Commit refreshed expectations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mus-rs/crates/mus-cli/tests/fixtures/parity_expectations.json
          if git diff --cached --quiet; then
            echo "Fast parity expectations already current"
            exit 0
          fi
          git commit -m "chore: refresh guarded fast parity expectations"
          git push origin "HEAD:${GITHUB_REF_NAME}"
