[project]
name = "ovillo-voice"
version = "0.1.0"
description = "Vera's voice into an Ovillo Body: record, analyse, render, compare. CLI, MCP server and a studio page."
requires-python = ">=3.12,<3.13"
dependencies = ["praat-parselmouth>=0.4.5", "numpy>=2", "scipy>=1.14", "matplotlib>=3.9",
                "faster-whisper==1.2.1", "onnxruntime==1.23.2"]   # 1.23.2: the last onnxruntime with macOS x86_64 wheels

[project.scripts]
ovillo-voice = "ovillo_voice.cli:main"
ovillo-voice-mcp = "ovillo_voice.mcp:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ovillo_voice"]

[tool.setuptools.package-data]
ovillo_voice = ["studio.html"]
