[package]
name = "ariadne-clap"
version = "0.1.0"
description = "Ariadne Terminal: a pure metamaterial VST3/CLAP boundary"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
mus-ariadne = { path = "../../crates/mus-ariadne" }
# nice-plug 0.2.3 uses the permissive `vst3` 0.3 bindings. The allocation
# assertion aborts debug processing if this wrapper or the core allocates on the
# audio thread; it is compiled out of release artifacts.
nice-plug = { package = "nice-plug", version = "=0.2.3", default-features = false, features = ["vst3", "assert_process_allocs"] }

[dev-dependencies]
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
