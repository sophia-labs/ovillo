[package]
name = "ariadne-clap"
version = "0.2.0"
description = "Ariadne World: one multi-body pure-metamaterial VST3/CLAP boundary"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
mus-ariadne = { path = "../../crates/mus-ariadne" }
nice-plug = { package = "nice-plug", version = "=0.2.3", default-features = false, features = ["vst3", "assert_process_allocs"] }

[dev-dependencies]
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
