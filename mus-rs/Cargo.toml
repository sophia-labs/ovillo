[workspace]
members = [
    "crates/mus-notation",
    "crates/mus-oplog",
    "crates/mus-graph",
    "crates/mus-text",
    "crates/mus-engine",
    "crates/mus-cli",
    "crates/mus-vocab",
    "crates/mus-dsp",
    "crates/mus-watsn",
    "crates/mus-observation",
    "crates/mus-ariadne",
    "crates/mus-ariadne-webgpu",
    "crates/mus-ariadne-webgpu-bridge",
    "crates/mus-ariadne-webgpu-web",
    "crates/mus-trajectory",
    "crates/mus-gesture",
    "crates/np-rand",
    "plugins/ariadne-clap",
    "xtask",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/sophia-labs/ovillo"

[patch.crates-io]
# nice-plug 0.2.3 trusts the untrusted length prefix in a CLAP state stream and
# can abort on a corrupt session. Keep the otherwise-identical, narrowly
# hardened source in-tree until the fix is available in a released crate.
nice-plug = { path = "vendor/nice-plug" }
