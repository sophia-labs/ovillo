[package]
name = "mus-engine"
version = "0.1.0"
description = "Deterministic sampler render face for MUS ScoreGraphs"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["soxr"]
# libsoxr (C) for sample/voice resampling. `mus-wasm` builds without it and
# renders Ariadne Worlds only.
soxr = ["mus-dsp/soxr"]

[dependencies]
hound = "3.5"
mus-ariadne = { path = "../mus-ariadne" }
mus-dsp = { path = "../mus-dsp", default-features = false, features = ["full"] }
mus-notation = { path = "../mus-notation" }
mus-text = { path = "../mus-text" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
