[package]
name = "mus-ariadne"
version = "0.2.0"
description = "Canonical multi-body pure-physics World runtime for Ariadne"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
mus-observation = { path = "../mus-observation" }
mus-trajectory = { path = "../mus-trajectory" }
mus-watsn = { path = "../mus-watsn" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
thiserror = "2"
