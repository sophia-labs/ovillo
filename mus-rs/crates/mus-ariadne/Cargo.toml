[package]
name = "mus-ariadne"
version = "0.1.0"
description = "Canonical pure-physics world runtime for Ariadne"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
compat-terminal = []

[dependencies]
mus-watsn = { path = "../mus-watsn" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
