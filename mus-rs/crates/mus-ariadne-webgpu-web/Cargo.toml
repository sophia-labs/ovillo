[package]
name = "mus-ariadne-webgpu-web"
version = "0.1.0"
description = "Canonical browser viewer for Ariadne World observation bundles"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1"
mus-ariadne = { path = "../mus-ariadne" }
mus-ariadne-webgpu = { path = "../mus-ariadne-webgpu", default-features = false }
mus-ariadne-webgpu-bridge = { path = "../mus-ariadne-webgpu-bridge" }
mus-observation = { path = "../mus-observation" }
serde_json = "1"
thiserror = "2"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
wgpu = "29"
