[package]
name = "mus-dsp"
version = "0.1.0"
description = "Sample-faithful DSP kernels for the MUS Rust engine"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Preserve the historical all-kernels crate for the renderer and test suite.
default = ["full"]
# Compatibility-only Ariadne surface. All implementation ownership lives in
# `mus-ariadne`; this feature keeps old imports compiling during migration.
ariadne-live = ["dep:mus-ariadne"]
full = [
    "ariadne-live",
    "dep:hound",
    "dep:libc",
    "dep:libsoxr",
    "dep:mus-trajectory",
    "dep:mus-watsn",
    "dep:np-rand",
    "dep:realfft",
    "dep:rustfft",
    "dep:serde_json",
    "dep:sha2",
]

[dependencies]
hound = { version = "3.5", optional = true }
libc = { version = "0.2", optional = true }
libsoxr = { version = "0.2.9", optional = true }
mus-ariadne = { path = "../mus-ariadne", optional = true }
mus-trajectory = { path = "../mus-trajectory", optional = true }
mus-watsn = { path = "../mus-watsn", optional = true }
np-rand = { path = "../np-rand", optional = true }
realfft = { version = "3.5", optional = true }
rustfft = { version = "6", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }

[dev-dependencies]
mus-gesture = { path = "../mus-gesture" }
