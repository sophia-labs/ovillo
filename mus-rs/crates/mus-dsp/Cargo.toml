[package]
name = "mus-dsp"
version = "0.1.0"
description = "Sample-faithful DSP kernels for the MUS Rust engine"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
hound = "3.5"
libc = "0.2"
mus-trajectory = { path = "../mus-trajectory" }
mus-watsn = { path = "../mus-watsn" }
np-rand = { path = "../np-rand" }
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
mus-gesture = { path = "../mus-gesture" }
