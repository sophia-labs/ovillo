[package]
name = "mus-cli"
version = "0.1.0"
description = "Command-line faces for the MUS graph"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "mus"
path = "src/main.rs"

[dependencies]
mus-dsp = { path = "../mus-dsp" }
# Unified U3: the braid probe takes compiled complex words as data; the
# word type lives in the law crate (already in the graph via mus-dsp).
mus-watsn = { path = "../mus-watsn" }
mus-engine = { path = "../mus-engine" }
mus-graph = { path = "../mus-graph" }
mus-notation = { path = "../mus-notation" }
mus-oplog = { path = "../mus-oplog" }
mus-text = { path = "../mus-text" }
mus-vocab = { version = "0.1.0", path = "../mus-vocab" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# The browser engine, run natively: its render must be `mus render`'s.
mus-wasm = { path = "../mus-wasm" }
