[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "token-radiation-unified-world-v1"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["torch>=2.10", "numpy>=2.3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
token-radiation-unified-world-v1 = "token_radiation_unified_world_v1.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
